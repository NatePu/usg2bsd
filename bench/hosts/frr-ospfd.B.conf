! FRR ospfd for host B (STOCK_TEST_PLAN.md section 9). The 10.250.3.0/30
! network is the second path of topology F (ERRATA E87); it is harmless
! elsewhere. Failover: "ip link set enp1s0.21 down" (or the other path).
interface lo
 ip ospf passive
!
router ospf
 ospf router-id 198.19.0.1
 network 10.250.2.0/30 area 0.0.0.0
 network 10.250.3.0/30 area 0.0.0.0
 network 198.19.0.1/32 area 0.0.0.0
